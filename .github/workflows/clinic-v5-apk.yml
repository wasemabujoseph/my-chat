name: Build Clinic v5 APK
on:
  push:
    branches: [clinic-v5-apk-build]
    paths:
      - 'android-build/**'
      - '.github/workflows/clinic-v5-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run send regression tests
        working-directory: android-build
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: android-build
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Dr-Amer-Clinic-v5-Android-Test
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
